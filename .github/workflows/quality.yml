name: Website quality gate

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Next.js SSR, tRPC, and public routes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test

      - name: Build Next.js production app
        run: NEXT_PUBLIC_SITE_URL=http://localhost:4101 pnpm build

      - name: Start production Next.js server
        run: |
          NEXT_PUBLIC_SITE_URL=http://localhost:4101 PORT=4101 pnpm start > /tmp/akbar-next-ci.log 2>&1 &
          echo $! > /tmp/akbar-next-ci.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://localhost:4101/robots.txt >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/akbar-next-ci.log
          exit 1

      - name: Verify crawler-visible HTML, redirects, and API
        run: BASE=http://localhost:4101 bash scripts/verify-next.sh

      - name: Stop production Next.js server
        if: always()
        run: |
          if [ -f /tmp/akbar-next-ci.pid ]; then
            kill "$(cat /tmp/akbar-next-ci.pid)" 2>/dev/null || true
          fi
