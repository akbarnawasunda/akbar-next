.mq{position:absolute;bottom:0;left:0;right:0;border-top:1px solid rgba(255,255,255,.09);padding:12px 0;overflow:hidden;white-space:nowrap;color:#8b8b96;font-size:11px;letter-spacing:.3em}
.mq span{display:inline-block;animation:mq 18s linear infinite}
