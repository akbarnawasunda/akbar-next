<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="application-name"
      content="Akbar Nawasunda | Official Website"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Akbar Nawasunda | Official Website"
    />
    <!--app-head-->
    <link rel="icon" type="image/jpeg" href="/assets/akbar-favicon.jpg" />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/assets/akbar-favicon.jpg"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101211" />
    <!-- Legacy font names Bebas+Neue and Manrope are intentionally replaced by local Fontsource bundles. -->
    <link
      rel="preload"
      href="/assets/fonts/fontshare/clash-display-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontshare/general-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontshare/azeret-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body>
    <!-- Splash pembuka: identitas brand, tanpa telemetri palsu dan tanpa persentase karangan. -->
    <style id="akbar-preloader-styles">
      /* Splash pembuka: tanda tangan Akbar — wordmark, pola langkah drum
         (breakbeat), jam WIB yang hidup, dan durasi muat yang jujur.
         Tanpa persentase karangan, tanpa angka acak. */
      #akbar-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0c;
        color: #eceae5;
        pointer-events: all;
      }
      #akbar-preloader::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 40vh;
        background: linear-gradient(to top, #111214, rgba(17, 18, 20, 0));
        pointer-events: none;
      }
      .an-splash-inner {
        position: relative;
        z-index: 1;
        width: min(92%, 560px);
        padding: 0 4vw;
      }
      .an-splash-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 clamp(18px, 4vw, 30px);
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #74746f;
        opacity: 0;
        animation: an-splash-fade 0.6s ease 0.1s forwards;
      }
      .an-splash-live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #8fb2c0;
      }
      .an-splash-live i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8fb2c0;
        animation: an-splash-pulse 2.4s ease-in-out infinite;
      }
      .an-splash-line {
        display: block;
        overflow: hidden;
      }
      .an-splash-word {
        display: block;
        font-family:
          "Clash Display",
          "Syne",
          system-ui,
          -apple-system,
          sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 11vw, 5.25rem);
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        transform: translateY(105%);
        animation: an-splash-rise 0.86s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .an-splash-line:nth-child(3) .an-splash-word {
        animation-delay: 0.08s;
      }
      @keyframes an-splash-rise {
        to {
          transform: translateY(0);
        }
      }
      /* Pola langkah drum: delapan ketukan yang menyala berurutan. */
      .an-splash-steps {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 26px;
        margin: clamp(18px, 4vw, 28px) 0 14px;
      }
      .an-splash-steps span {
        width: 3px;
        height: 8px;
        background: rgba(236, 234, 229, 0.22);
        animation: an-splash-step 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .an-splash-steps span:nth-child(1) {
        animation-delay: 0s;
      }
      .an-splash-steps span:nth-child(2) {
        animation-delay: 0.1s;
      }
      .an-splash-steps span:nth-child(3) {
        animation-delay: 0.2s;
      }
      .an-splash-steps span:nth-child(4) {
        animation-delay: 0.3s;
      }
      .an-splash-steps span:nth-child(5) {
        animation-delay: 0.4s;
      }
      .an-splash-steps span:nth-child(6) {
        animation-delay: 0.5s;
      }
      .an-splash-steps span:nth-child(7) {
        animation-delay: 0.6s;
      }
      .an-splash-steps span:nth-child(8) {
        animation-delay: 0.7s;
      }
      @keyframes an-splash-step {
        0%,
        55%,
        100% {
          height: 8px;
          background: rgba(236, 234, 229, 0.22);
        }
        20%,
        35% {
          height: 26px;
          background: #8fb2c0;
        }
      }
      .an-splash-rule {
        height: 1px;
        background: #8fb2c0;
        transform-origin: left center;
        transform: scaleX(0);
        animation: an-splash-wipe 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.18s
          forwards;
      }
      @keyframes an-splash-wipe {
        to {
          transform: scaleX(1);
        }
      }
      /* Meter durasi: diisi oleh skrip mengikuti waktu yang benar-benar jalan. */
      .an-splash-meter {
        position: relative;
        height: 1px;
        margin: 5px 0 14px;
        background: rgba(236, 234, 229, 0.12);
        overflow: hidden;
      }
      .an-splash-meter i {
        position: absolute;
        inset: 0;
        background: rgba(236, 234, 229, 0.5);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 120ms linear;
      }
      .an-splash-caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #74746f;
        opacity: 0;
        animation: an-splash-fade 0.6s ease 0.42s forwards;
      }
      .an-splash-elapsed {
        color: #eceae5;
        font-variant-numeric: tabular-nums;
      }
      .an-splash-birthday {
        margin: 16px 0 0;
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #dcb573;
      }
      @keyframes an-splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes an-splash-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      #akbar-preloader.an-fade-out {
        animation: an-splash-lift 0.52s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        pointer-events: none;
      }
      @keyframes an-splash-lift {
        to {
          transform: translateY(-101%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .an-splash-word,
        .an-splash-rule,
        .an-splash-top,
        .an-splash-caption,
        .an-splash-steps span,
        .an-splash-live i,
        #akbar-preloader.an-fade-out {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }
        #akbar-preloader.an-fade-out {
          opacity: 0;
        }
      }
    </style>

    <div
      id="akbar-preloader"
      role="status"
      aria-label="Memuat situs Akbar Nawasunda"
    >
      <div class="an-splash-inner">
        <p class="an-splash-top">
          <span class="an-splash-live">
            <i aria-hidden="true"></i>WIB
            <span id="an-splash-clock">--.--.--</span>
          </span>
          <span id="an-splash-date">Bandung Barat</span>
        </p>
        <span class="an-splash-line"
          ><span class="an-splash-word">Akbar</span></span
        >
        <span class="an-splash-line"
          ><span class="an-splash-word">Nawasunda</span></span
        >
        <div class="an-splash-steps" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="an-splash-rule" aria-hidden="true"></div>
        <div class="an-splash-meter" aria-hidden="true">
          <i id="an-splash-meter-fill"></i>
        </div>
        <div class="an-splash-caption">
          <span>Producer &middot; Remixer &middot; Bandung Barat</span>
          <span class="an-splash-elapsed"
            ><span id="an-splash-elapsed">0.0</span>s</span
          >
        </div>
        <p class="an-splash-birthday" id="an-splash-birthday" hidden>
          Selamat ulang tahun, Akbar &middot; 01 November
        </p>
      </div>
    </div>

    <script id="akbar-preloader-script">
      (function () {
        var preloader = document.getElementById("akbar-preloader");
        if (!preloader) return;

        var reduced = false;
        try {
          reduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (error) {
          reduced = false;
        }

        // Splash hanya untuk kunjungan pertama dalam satu sesi. Kunjungan
        // berikutnya (dan navigasi antar-rute) langsung melihat konten.
        var seen = false;
        try {
          seen = sessionStorage.getItem("an-splash-seen") === "1";
          sessionStorage.setItem("an-splash-seen", "1");
        } catch (error) {
          seen = false;
        }

        // --- Jam studio: selalu waktu Jakarta (WIB), apa pun zona perangkat. ---
        var jakartaFormat = null;
        try {
          jakartaFormat = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Jakarta",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23",
            weekday: "long",
          });
        } catch (error) {
          jakartaFormat = null;
        }

        var MONTHS = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember",
        ];

        function jakartaStamp(date) {
          if (jakartaFormat) {
            try {
              var out = {};
              var parts = jakartaFormat.formatToParts(date);
              for (var i = 0; i < parts.length; i++) {
                if (parts[i].type !== "literal") out[parts[i].type] = parts[i].value;
              }
              return {
                h: Number(out.hour) % 24,
                m: Number(out.minute),
                s: Number(out.second),
                day: Number(out.day),
                month: Number(out.month),
                year: Number(out.year),
                weekday: out.weekday || "",
              };
            } catch (error) {
              /* jatuh ke waktu perangkat di bawah */
            }
          }
          return {
            h: date.getHours(),
            m: date.getMinutes(),
            s: date.getSeconds(),
            day: date.getDate(),
            month: date.getMonth() + 1,
            year: date.getFullYear(),
            weekday: "",
          };
        }

        var clockEl = document.getElementById("an-splash-clock");
        var dateEl = document.getElementById("an-splash-date");
        var elapsedEl = document.getElementById("an-splash-elapsed");
        var meterFill = document.getElementById("an-splash-meter-fill");
        var birthdayEl = document.getElementById("an-splash-birthday");

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function paintTime() {
          var stamp = jakartaStamp(new Date());
          if (clockEl) {
            clockEl.textContent =
              pad(stamp.h) + "." + pad(stamp.m) + "." + pad(stamp.s);
          }
          if (dateEl) {
            var day = stamp.weekday ? stamp.weekday.toUpperCase().slice(0, 3) + " · " : "";
            dateEl.textContent =
              day + stamp.day + " " + MONTHS[stamp.month - 1].toUpperCase() + " " + stamp.year;
          }
          // 1 November waktu Jakarta: situs merayakan sendiri, tiap tahun.
          if (stamp.month === 11 && stamp.day === 1) {
            document.documentElement.setAttribute("data-birthday", "on");
            preloader.classList.add("is-birthday");
            if (birthdayEl) birthdayEl.hidden = false;
          }
        }

        paintTime();
        var clockTimer = setInterval(paintTime, 1000);

        function drop() {
          clearInterval(clockTimer);
          clearInterval(progressTimer);
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }

        if (seen || reduced) {
          window.__dismissAkbarPreloader = drop;
          drop();
          return;
        }

        var dismissed = false;
        var shownAt = Date.now();
        // Durasi splash: minimal 1.4 detik supaya seluruh sekuens terbaca,
        // dan tidak pernah lebih dari 2.2 detik.
        var MIN_VISIBLE = 1400;
        var MAX_VISIBLE = 2200;

        // Angka durasi = waktu yang benar-benar berjalan sejak splash tampil.
        function paintProgress() {
          var elapsed = Date.now() - shownAt;
          if (elapsedEl) elapsedEl.textContent = (elapsed / 1000).toFixed(1);
          if (meterFill) {
            meterFill.style.transform =
              "scaleX(" + Math.min(1, elapsed / MAX_VISIBLE) + ")";
          }
        }
        paintProgress();
        var progressTimer = setInterval(paintProgress, 100);

        function remove() {
          if (!preloader) return;
          preloader.classList.add("an-fade-out");
          setTimeout(drop, 560);
        }

        window.__dismissAkbarPreloader = function () {
          if (dismissed) return;
          dismissed = true;
          var wait = Math.max(0, MIN_VISIBLE - (Date.now() - shownAt));
          setTimeout(remove, wait);
        };

        // Jaring pengaman: splash tidak pernah menahan konten lebih lama dari ini.
        setTimeout(function () {
          if (typeof window.__dismissAkbarPreloader === "function") {
            window.__dismissAkbarPreloader();
          }
        }, MAX_VISIBLE);
      })();
    </script>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
