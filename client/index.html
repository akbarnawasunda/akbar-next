<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="application-name"
      content="Akbar Nawasunda | Official Website"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Akbar Nawasunda | Official Website"
    />
    <!--app-head-->
    <link rel="icon" type="image/jpeg" href="/assets/akbar-favicon.jpg" />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/assets/akbar-favicon.jpg"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101211" />
    <!-- Core type is self-hosted. Preload only the fonts required above the fold. -->
    <link
      rel="preload"
      href="/assets/fonts/fontsource/Recons-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontsource/Good Times Rg.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontsource/NEXROID-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontsource/noto-sans-sundanese-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body>
    <!-- Splash pembuka: identitas brand, tanpa telemetri palsu dan tanpa persentase karangan. -->
    <style id="akbar-preloader-styles">
/* Splash pembuka: tanda tangan Akbar — wordmark, pola langkah drum
         (breakbeat), jam WIB yang hidup, dan durasi muat yang jujur.
         Tanpa persentase karangan, tanpa angka acak. */
      #akbar-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101211;
        color: #f1efe9;
        pointer-events: all;
        /* If JavaScript fails to load, the server-rendered page must unblock. */
        animation: an-splash-failsafe 1ms linear 1.6s forwards;
      }
      @keyframes an-splash-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      #akbar-preloader::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 40vh;
        background: linear-gradient(to top, #171a18, rgba(23, 26, 24, 0));
        pointer-events: none;
      }
      .an-splash-inner {
        position: relative;
        z-index: 1;
        /* 1100px, bukan 560px: wordmark splash jauh lebih besar sejak
           Fase 6E dan kotak lama memotongnya di desktop. */
        width: min(92vw, 1100px);
        padding: 0 4vw;
      }
      .an-splash-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 clamp(18px, 4vw, 30px);
        font-family: "Good Times", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #777a74;
        opacity: 0;
        animation: an-splash-fade 0.24s ease 0.03s forwards;
      }
      .an-splash-live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #9bb9c1;
      }
      .an-splash-live i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9bb9c1;
        animation: an-splash-pulse 1.6s ease-in-out infinite;
      }
      .an-splash-line {
        display: block;
        overflow: hidden;
      }
      .an-splash-word {
        display: block;
        font-family: "Recons", "Good Times", sans-serif;
        font-weight: 400;
        /* Recons is wider than the prior condensed display; this bound keeps
           the wordmark intact from compact phones through desktop. */
        font-size: clamp(2.1rem, 12vw, 8.6rem);
        line-height: 0.94;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        transform: translateY(105%);
        animation: an-splash-rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.06s
          forwards;
      }
      .an-splash-line:nth-child(3) .an-splash-word {
        animation-delay: 0.11s;
      }
      @keyframes an-splash-rise {
        to {
          transform: translateY(0);
        }
      }
      .an-splash-aksara {
        display: block;
        margin: 0.42em 0 0;
        font-family: "Noto Sans Sundanese", system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(1.15rem, 5.2vw, 2.3rem);
        line-height: 1.9;
        color: #9bb9c1;
        clip-path: inset(0 100% 0 0);
        /* Beat pertama: aksara ditulis lebih dulu, baru nama Latin naik.
           Yang memimpin layar pembuka adalah identitasnya, bukan wordmark. */
        animation: an-splash-write 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes an-splash-write {
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      /* Versi ringkas (kunjungan ke-2 dalam satu sesi): isi pendukung
         disembunyikan, sekuens dipercepat ±3×. Tetap nama dalam aksara,
         tetap satu gerakan — hanya lebih singkat. */
      #akbar-preloader.an-splash-quick .an-splash-top,
      #akbar-preloader.an-splash-quick .an-splash-steps,
      #akbar-preloader.an-splash-quick .an-splash-meter,
      #akbar-preloader.an-splash-quick .an-splash-birthday {
        display: none;
      }
      #akbar-preloader.an-splash-quick .an-splash-aksara {
        animation-duration: 0.12s;
      }
      #akbar-preloader.an-splash-quick .an-splash-word {
        animation-duration: 0.13s;
        animation-delay: 0.03s;
      }
      #akbar-preloader.an-splash-quick
        .an-splash-line:nth-child(3)
        .an-splash-word {
        animation-delay: 0.08s;
      }
      #akbar-preloader.an-splash-quick .an-splash-rule {
        animation-duration: 0.18s;
        animation-delay: 0.05s;
      }
      #akbar-preloader.an-splash-quick .an-splash-caption {
        animation-duration: 0.12s;
        animation-delay: 0.08s;
      }

      /* Pola langkah drum: delapan ketukan yang menyala berurutan. */
      .an-splash-steps {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 26px;
        margin: clamp(18px, 4vw, 28px) 0 14px;
      }
      .an-splash-steps span {
        width: 3px;
        height: 8px;
        background: rgba(236, 234, 229, 0.22);
        animation: an-splash-step 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .an-splash-steps span:nth-child(1) {
        animation-delay: 0s;
      }
      .an-splash-steps span:nth-child(2) {
        animation-delay: 0.1s;
      }
      .an-splash-steps span:nth-child(3) {
        animation-delay: 0.2s;
      }
      .an-splash-steps span:nth-child(4) {
        animation-delay: 0.3s;
      }
      .an-splash-steps span:nth-child(5) {
        animation-delay: 0.4s;
      }
      .an-splash-steps span:nth-child(6) {
        animation-delay: 0.5s;
      }
      .an-splash-steps span:nth-child(7) {
        animation-delay: 0.6s;
      }
      .an-splash-steps span:nth-child(8) {
        animation-delay: 0.7s;
      }
      @keyframes an-splash-step {
        0%,
        55%,
        100% {
          height: 8px;
          background: rgba(236, 234, 229, 0.22);
        }
        20%,
        35% {
          height: 26px;
          background: #9bb9c1;
        }
      }
      .an-splash-rule {
        height: 1px;
        background: #9bb9c1;
        transform-origin: left center;
        transform: scaleX(0);
        animation: an-splash-wipe 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.11s
          forwards;
      }
      @keyframes an-splash-wipe {
        to {
          transform: scaleX(1);
        }
      }
      /* Meter durasi: diisi oleh skrip mengikuti waktu yang benar-benar jalan. */
      .an-splash-meter {
        position: relative;
        height: 1px;
        margin: 5px 0 14px;
        background: rgba(236, 234, 229, 0.12);
        overflow: hidden;
      }
      .an-splash-meter i {
        position: absolute;
        inset: 0;
        background: rgba(236, 234, 229, 0.5);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 120ms linear;
      }
      .an-splash-caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        font-family: "Good Times", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #777a74;
        opacity: 0;
        animation: an-splash-fade 0.24s ease 0.23s forwards;
      }
      .an-splash-elapsed {
        color: #f1efe9;
        font-variant-numeric: tabular-nums;
      }
      .an-splash-birthday {
        margin: 16px 0 0;
        font-family: "Good Times", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #dcb573;
      }
      @keyframes an-splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes an-splash-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      #akbar-preloader.an-fade-out {
        animation: an-splash-lift 0.22s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        pointer-events: none;
      }
      @keyframes an-splash-lift {
        to {
          transform: translateY(-101%);
          opacity: 0;
          visibility: hidden;
        }
      }
      #akbar-preloader.an-splash-quick.an-fade-out {
        animation-duration: 0.15s;
      }
      @media (prefers-reduced-motion: reduce) {
        #akbar-preloader,
        .an-splash-word,
        .an-splash-aksara,
        .an-splash-rule,
        .an-splash-top,
        .an-splash-caption,
        .an-splash-steps span,
        .an-splash-live i,
        #akbar-preloader.an-fade-out {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }
        #akbar-preloader {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
    </style>

    <div
      id="akbar-preloader"
      role="status"
      aria-label="Memuat situs Akbar Nawasunda"
      aria-live="polite"
    >
      <div class="an-splash-inner">
        <p class="an-splash-top" aria-hidden="true">
          <span class="an-splash-live">
            <i aria-hidden="true"></i>WIB
            <span id="an-splash-clock">--.--.--</span>
          </span>
          <span id="an-splash-date">Bandung Barat</span>
        </p>
        <span class="an-splash-line"
          ><span class="an-splash-word">Akbar</span></span
        >
        <span class="an-splash-line"
          ><span class="an-splash-word">Nawasunda</span></span
        >
        <!-- Nama yang sama dalam aksara Sunda: tersingkap kiri ke kanan
             seperti sedang dituliskan. Inilah yang membuat layar pembuka
             ini tidak bisa dipakai artis lain. Bacaan Latinnya sudah ada
             tepat di atasnya, jadi baris ini murni dekoratif. -->
        <span class="an-splash-aksara" aria-hidden="true" lang="su-Sund"
          >ᮃᮊ᮪ᮘᮁ ᮔᮝᮞᮥᮔ᮪ᮓ</span
        >
        <div class="an-splash-steps" aria-hidden="true">
          <span></span><span></span><span></span><span></span> <span></span
          ><span></span><span></span><span></span>
        </div>
        <div class="an-splash-rule" aria-hidden="true"></div>
        <div class="an-splash-meter" aria-hidden="true">
          <i id="an-splash-meter-fill"></i>
        </div>
        <div class="an-splash-caption" aria-hidden="true">
          <span>Memuat halaman &middot; Produser &middot; Remixer &middot; Bandung Barat</span>
          <span class="an-splash-elapsed"
            ><span id="an-splash-elapsed">0.0</span>s</span
          >
        </div>
        <p class="an-splash-birthday" id="an-splash-birthday" hidden aria-hidden="true">
          Selamat ulang tahun, Akbar &middot; 01 November
        </p>
      </div>
    </div>

    <script id="akbar-preloader-script">
(function () {
  var preloader = document.getElementById("akbar-preloader");
  if (!preloader) return;

  var reducedMotion = false;
  try {
    reducedMotion =
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (error) {
    reducedMotion = false;
  }

  // Full signature on first visit; repeat visits keep only the quick wordmark.
  var seen = false;
  try {
    seen = sessionStorage.getItem("an-splash-seen") === "1";
    sessionStorage.setItem("an-splash-seen", "1");
  } catch (error) {
    seen = false;
  }
  if (seen) preloader.classList.add("an-splash-quick");

  var clockEl = document.getElementById("an-splash-clock");
  var dateEl = document.getElementById("an-splash-date");
  var elapsedEl = document.getElementById("an-splash-elapsed");
  var meterFill = document.getElementById("an-splash-meter-fill");
  var birthdayEl = document.getElementById("an-splash-birthday");
  var months = [
    "Januari", "Februari", "Maret", "April", "Mei", "Juni",
    "Juli", "Agustus", "September", "Oktober", "November", "Desember",
  ];

  function now() {
    return window.performance && typeof window.performance.now === "function"
      ? window.performance.now()
      : Date.now();
  }

  function pad(value) {
    return value < 10 ? "0" + value : String(value);
  }

  function getJakartaStamp(date) {
    try {
      var parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Jakarta",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
        weekday: "long",
      }).formatToParts(date);
      var values = {};
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type !== "literal") values[parts[i].type] = parts[i].value;
      }
      return {
        hour: Number(values.hour) % 24,
        minute: Number(values.minute),
        second: Number(values.second),
        day: Number(values.day),
        month: Number(values.month),
        year: Number(values.year),
        weekday: values.weekday || "",
      };
    } catch (error) {
      return {
        hour: date.getHours(),
        minute: date.getMinutes(),
        second: date.getSeconds(),
        day: date.getDate(),
        month: date.getMonth() + 1,
        year: date.getFullYear(),
        weekday: "",
      };
    }
  }

  function paintTime() {
    var stamp = getJakartaStamp(new Date());
    if (clockEl) {
      clockEl.textContent =
        pad(stamp.hour) + "." + pad(stamp.minute) + "." + pad(stamp.second);
    }
    if (dateEl) {
      var weekday = stamp.weekday
        ? stamp.weekday.toUpperCase().slice(0, 3) + " · "
        : "";
      dateEl.textContent =
        weekday + stamp.day + " " + months[stamp.month - 1].toUpperCase() + " " + stamp.year;
    }
    if (stamp.month === 11 && stamp.day === 1) {
      document.documentElement.setAttribute("data-birthday", "on");
      preloader.classList.add("is-birthday");
      if (birthdayEl) birthdayEl.hidden = false;
    }
  }

  var startedAt = now();
  var minimumVisible = seen ? 240 : 530;
  // The deadline includes the exit animation; hardRemoveTimer is a final guard.
  var maximumVisible = seen ? 650 : 1300;
  var exitDuration = seen ? 150 : 220;
  var clockTimer = 0;
  var progressTimer = 0;
  var dismissTimer = 0;
  var forcedDismissTimer = 0;
  var hardRemoveTimer = 0;
  var dismissed = false;
  var removed = false;

  function clearTimers() {
    window.clearInterval(clockTimer);
    window.clearInterval(progressTimer);
    window.clearTimeout(dismissTimer);
    window.clearTimeout(forcedDismissTimer);
    window.clearTimeout(hardRemoveTimer);
  }

  function drop() {
    if (removed) return;
    removed = true;
    clearTimers();
    if (window.__dismissAkbarPreloader === requestDismiss) {
      window.__dismissAkbarPreloader = undefined;
    }
    if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
  }

  function startExit() {
    if (removed) return;
    preloader.classList.add("an-fade-out");
    // Give the browser one extra frame after the CSS transition has ended.
    dismissTimer = window.setTimeout(drop, exitDuration + 30);
  }

  function requestDismiss() {
    if (dismissed || removed) return;
    dismissed = true;
    window.clearTimeout(forcedDismissTimer);
    var elapsed = now() - startedAt;
    var remaining = Math.max(0, minimumVisible - elapsed);
    dismissTimer = window.setTimeout(startExit, remaining);
  }

  if (reducedMotion) {
    drop();
    return;
  }

  window.__dismissAkbarPreloader = requestDismiss;
  paintTime();
  clockTimer = window.setInterval(paintTime, 1000);

  function paintProgress() {
    var elapsed = now() - startedAt;
    if (elapsedEl) elapsedEl.textContent = (elapsed / 1000).toFixed(1);
    if (meterFill) {
      var activeDuration = Math.max(1, maximumVisible - exitDuration);
      meterFill.style.transform = "scaleX(" + Math.min(1, elapsed / activeDuration) + ")";
    }
  }
  paintProgress();
  progressTimer = window.setInterval(paintProgress, 200);

  // Do not wait for React hydration: the page HTML already exists beneath the
  // splash. Dismiss after the first paint, with a short floor for the motion.
  if (window.requestAnimationFrame) {
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(requestDismiss);
    });
  } else {
    window.setTimeout(requestDismiss, 16);
  }

  // Force the exit to begin early enough that it finishes inside this deadline.
  forcedDismissTimer = window.setTimeout(
    requestDismiss,
    Math.max(0, maximumVisible - exitDuration),
  );
  // If timers or the animation are interrupted, never leave a blocking layer.
  hardRemoveTimer = window.setTimeout(drop, maximumVisible + 40);
})();
    </script>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
