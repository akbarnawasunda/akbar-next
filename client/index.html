<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="application-name"
      content="Akbar Nawasunda | Official Website"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Akbar Nawasunda | Official Website"
    />
    <!--app-head-->
    <link rel="icon" type="image/jpeg" href="/assets/akbar-favicon.jpg" />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/assets/akbar-favicon.jpg"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101211" />
    <!-- Legacy font names Bebas+Neue and Manrope are intentionally replaced by local Fontsource bundles. -->
    <!--
      Fase 6: yang di-preload adalah font JUDUL (Syne 800), bukan lagi
      Clash Display 500. H1 adalah elemen terbesar di layar pertama, jadi
      ia yang paling mahal kalau harus di-swap; Clash tetap dipakai H2/H3
      yang semuanya di bawah lipatan dan cukup dengan `font-display: swap`.
      Jumlah file preload tetap tiga, totalnya justru turun (63 → 62 kB).
    -->
    <link
      rel="preload"
      href="/assets/fonts/fontsource/big-shoulders-display-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontshare/general-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fontshare/azeret-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Fase 6D: aksara Sunda ikut di-preload (4,9 kB) karena sekarang ia
      muncul di splash — hal pertama yang dilihat pengunjung. Tanpa preload
      baris aksaranya sempat kosong beberapa ratus milidetik.
    -->
    <link
      rel="preload"
      href="/assets/fonts/fontsource/noto-sans-sundanese-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body>
    <!-- Splash pembuka: identitas brand, tanpa telemetri palsu dan tanpa persentase karangan. -->
    <style id="akbar-preloader-styles">
      /* Splash pembuka: tanda tangan Akbar — wordmark, pola langkah drum
         (breakbeat), jam WIB yang hidup, dan durasi muat yang jujur.
         Tanpa persentase karangan, tanpa angka acak. */
      #akbar-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101211;
        color: #f1efe9;
        pointer-events: all;
      }
      #akbar-preloader::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 40vh;
        background: linear-gradient(to top, #171a18, rgba(23, 26, 24, 0));
        pointer-events: none;
      }
      .an-splash-inner {
        position: relative;
        z-index: 1;
        /* 1100px, bukan 560px: wordmark splash jauh lebih besar sejak
           Fase 6E dan kotak lama memotongnya di desktop. */
        width: min(92vw, 1100px);
        padding: 0 4vw;
      }
      .an-splash-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 clamp(18px, 4vw, 30px);
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #777a74;
        opacity: 0;
        animation: an-splash-fade 0.6s ease 0.1s forwards;
      }
      .an-splash-live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #9bb9c1;
      }
      .an-splash-live i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9bb9c1;
        animation: an-splash-pulse 2.4s ease-in-out infinite;
      }
      .an-splash-line {
        display: block;
        overflow: hidden;
      }
      .an-splash-word {
        display: block;
        /* Syne 800 lebih dulu — font judul situs ini. Tracking POSITIF:
           pada tracking negatif huruf Syne 800 bertabrakan
           (docs/notes/hero-tracking-scan.png). Ukuran ikut dikecilkan
           supaya lebar barisnya tidak berubah. */
        font-family:
          "Big Shoulders Display",
          "Clash Display",
          system-ui,
          -apple-system,
          sans-serif;
        font-weight: 800;
        /* Ukuran DITURUNKAN dari lebar kotaknya sendiri, bukan ditebak dari
           lebar layar. "Nawasunda" memakai 4,53em pada tracking +0,02em
           (diukur dari big-shoulders-display-800.woff2); pembagi 4,6 memberi
           sisa ±1,5%. Dengan rumus ini kata itu MUSTAHIL terpotong di lebar
           berapa pun — inilah penyebab splash kepotong di desktop tapi utuh
           di ponsel. */
        /* Pembagi 4,75 (bukan 4,6): kemiringan 9° menambah ±2,5% lebar
           tampak di ujung kanan. */
        font-size: max(2.4rem, calc((min(92vw, 1100px) - 8vw) / 4.75));
        line-height: 0.94;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        font-style: oblique 9deg;
        transform: translateY(105%);
        animation: an-splash-rise 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.3s
          forwards;
      }
      .an-splash-line:nth-child(3) .an-splash-word {
        animation-delay: 0.4s;
      }
      @keyframes an-splash-rise {
        to {
          transform: translateY(0);
        }
      }
      .an-splash-aksara {
        display: block;
        margin: 0.42em 0 0;
        font-family: "Noto Sans Sundanese", system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(1.15rem, 5.2vw, 2.3rem);
        line-height: 1.9;
        color: #9bb9c1;
        clip-path: inset(0 100% 0 0);
        /* Beat pertama: aksara ditulis lebih dulu, baru nama Latin naik.
           Yang memimpin layar pembuka adalah identitasnya, bukan wordmark. */
        animation: an-splash-write 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes an-splash-write {
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      /* Versi ringkas (kunjungan ke-2 dalam satu sesi): isi pendukung
         disembunyikan, sekuens dipercepat ±3×. Tetap nama dalam aksara,
         tetap satu gerakan — hanya lebih singkat. */
      #akbar-preloader.an-splash-quick .an-splash-top,
      #akbar-preloader.an-splash-quick .an-splash-steps,
      #akbar-preloader.an-splash-quick .an-splash-meter,
      #akbar-preloader.an-splash-quick .an-splash-caption,
      #akbar-preloader.an-splash-quick .an-splash-birthday {
        display: none;
      }
      #akbar-preloader.an-splash-quick .an-splash-aksara {
        animation-duration: 0.26s;
      }
      #akbar-preloader.an-splash-quick .an-splash-word {
        animation-duration: 0.3s;
        animation-delay: 0.12s;
      }
      #akbar-preloader.an-splash-quick
        .an-splash-line:nth-child(3)
        .an-splash-word {
        animation-delay: 0.18s;
      }
      #akbar-preloader.an-splash-quick .an-splash-rule {
        animation-duration: 0.34s;
        animation-delay: 0.22s;
      }

      /* Pola langkah drum: delapan ketukan yang menyala berurutan. */
      .an-splash-steps {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 26px;
        margin: clamp(18px, 4vw, 28px) 0 14px;
      }
      .an-splash-steps span {
        width: 3px;
        height: 8px;
        background: rgba(236, 234, 229, 0.22);
        animation: an-splash-step 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .an-splash-steps span:nth-child(1) {
        animation-delay: 0s;
      }
      .an-splash-steps span:nth-child(2) {
        animation-delay: 0.1s;
      }
      .an-splash-steps span:nth-child(3) {
        animation-delay: 0.2s;
      }
      .an-splash-steps span:nth-child(4) {
        animation-delay: 0.3s;
      }
      .an-splash-steps span:nth-child(5) {
        animation-delay: 0.4s;
      }
      .an-splash-steps span:nth-child(6) {
        animation-delay: 0.5s;
      }
      .an-splash-steps span:nth-child(7) {
        animation-delay: 0.6s;
      }
      .an-splash-steps span:nth-child(8) {
        animation-delay: 0.7s;
      }
      @keyframes an-splash-step {
        0%,
        55%,
        100% {
          height: 8px;
          background: rgba(236, 234, 229, 0.22);
        }
        20%,
        35% {
          height: 26px;
          background: #9bb9c1;
        }
      }
      .an-splash-rule {
        height: 1px;
        background: #9bb9c1;
        transform-origin: left center;
        transform: scaleX(0);
        animation: an-splash-wipe 0.78s cubic-bezier(0.22, 1, 0.36, 1) 0.62s
          forwards;
      }
      @keyframes an-splash-wipe {
        to {
          transform: scaleX(1);
        }
      }
      /* Meter durasi: diisi oleh skrip mengikuti waktu yang benar-benar jalan. */
      .an-splash-meter {
        position: relative;
        height: 1px;
        margin: 5px 0 14px;
        background: rgba(236, 234, 229, 0.12);
        overflow: hidden;
      }
      .an-splash-meter i {
        position: absolute;
        inset: 0;
        background: rgba(236, 234, 229, 0.5);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 120ms linear;
      }
      .an-splash-caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #777a74;
        opacity: 0;
        animation: an-splash-fade 0.6s ease 0.42s forwards;
      }
      .an-splash-elapsed {
        color: #f1efe9;
        font-variant-numeric: tabular-nums;
      }
      .an-splash-birthday {
        margin: 16px 0 0;
        font-family: "Azeret Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #dcb573;
      }
      @keyframes an-splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes an-splash-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      #akbar-preloader.an-fade-out {
        animation: an-splash-lift 0.52s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        pointer-events: none;
      }
      @keyframes an-splash-lift {
        to {
          transform: translateY(-101%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .an-splash-word,
        .an-splash-aksara,
        .an-splash-rule,
        .an-splash-top,
        .an-splash-caption,
        .an-splash-steps span,
        .an-splash-live i,
        #akbar-preloader.an-fade-out {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }
        #akbar-preloader.an-fade-out {
          opacity: 0;
        }
      }
    </style>

    <div
      id="akbar-preloader"
      role="status"
      aria-label="Memuat situs Akbar Nawasunda"
    >
      <div class="an-splash-inner">
        <p class="an-splash-top">
          <span class="an-splash-live">
            <i aria-hidden="true"></i>WIB
            <span id="an-splash-clock">--.--.--</span>
          </span>
          <span id="an-splash-date">Bandung Barat</span>
        </p>
        <span class="an-splash-line"
          ><span class="an-splash-word">Akbar</span></span
        >
        <span class="an-splash-line"
          ><span class="an-splash-word">Nawasunda</span></span
        >
        <!-- Nama yang sama dalam aksara Sunda: tersingkap kiri ke kanan
             seperti sedang dituliskan. Inilah yang membuat layar pembuka
             ini tidak bisa dipakai artis lain. Bacaan Latinnya sudah ada
             tepat di atasnya, jadi baris ini murni dekoratif. -->
        <span class="an-splash-aksara" aria-hidden="true" lang="su-Sund"
          >ᮃᮊ᮪ᮘᮁ ᮔᮝᮞᮥᮔ᮪ᮓ</span
        >
        <div class="an-splash-steps" aria-hidden="true">
          <span></span><span></span><span></span><span></span> <span></span
          ><span></span><span></span><span></span>
        </div>
        <div class="an-splash-rule" aria-hidden="true"></div>
        <div class="an-splash-meter" aria-hidden="true">
          <i id="an-splash-meter-fill"></i>
        </div>
        <div class="an-splash-caption">
          <span>Producer &middot; Remixer &middot; Bandung Barat</span>
          <span class="an-splash-elapsed"
            ><span id="an-splash-elapsed">0.0</span>s</span
          >
        </div>
        <p class="an-splash-birthday" id="an-splash-birthday" hidden>
          Selamat ulang tahun, Akbar &middot; 01 November
        </p>
      </div>
    </div>

    <script id="akbar-preloader-script">
      (function () {
        var preloader = document.getElementById("akbar-preloader");
        if (!preloader) return;

        var reduced = false;
        try {
          reduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (error) {
          reduced = false;
        }

        // Splash hanya untuk kunjungan pertama dalam satu sesi. Kunjungan
        // berikutnya (dan navigasi antar-rute) langsung melihat konten.
        var seen = false;
        try {
          seen = sessionStorage.getItem("an-splash-seen") === "1";
          sessionStorage.setItem("an-splash-seen", "1");
        } catch (error) {
          seen = false;
        }

        // --- Jam studio: selalu waktu Jakarta (WIB), apa pun zona perangkat. ---
        var jakartaFormat = null;
        try {
          jakartaFormat = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Jakarta",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23",
            weekday: "long",
          });
        } catch (error) {
          jakartaFormat = null;
        }

        var MONTHS = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember",
        ];

        function jakartaStamp(date) {
          if (jakartaFormat) {
            try {
              var out = {};
              var parts = jakartaFormat.formatToParts(date);
              for (var i = 0; i < parts.length; i++) {
                if (parts[i].type !== "literal")
                  out[parts[i].type] = parts[i].value;
              }
              return {
                h: Number(out.hour) % 24,
                m: Number(out.minute),
                s: Number(out.second),
                day: Number(out.day),
                month: Number(out.month),
                year: Number(out.year),
                weekday: out.weekday || "",
              };
            } catch (error) {
              /* jatuh ke waktu perangkat di bawah */
            }
          }
          return {
            h: date.getHours(),
            m: date.getMinutes(),
            s: date.getSeconds(),
            day: date.getDate(),
            month: date.getMonth() + 1,
            year: date.getFullYear(),
            weekday: "",
          };
        }

        var clockEl = document.getElementById("an-splash-clock");
        var dateEl = document.getElementById("an-splash-date");
        var elapsedEl = document.getElementById("an-splash-elapsed");
        var meterFill = document.getElementById("an-splash-meter-fill");
        var birthdayEl = document.getElementById("an-splash-birthday");

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function paintTime() {
          var stamp = jakartaStamp(new Date());
          if (clockEl) {
            clockEl.textContent =
              pad(stamp.h) + "." + pad(stamp.m) + "." + pad(stamp.s);
          }
          if (dateEl) {
            var day = stamp.weekday
              ? stamp.weekday.toUpperCase().slice(0, 3) + " · "
              : "";
            dateEl.textContent =
              day +
              stamp.day +
              " " +
              MONTHS[stamp.month - 1].toUpperCase() +
              " " +
              stamp.year;
          }
          // 1 November waktu Jakarta: situs merayakan sendiri, tiap tahun.
          if (stamp.month === 11 && stamp.day === 1) {
            document.documentElement.setAttribute("data-birthday", "on");
            preloader.classList.add("is-birthday");
            if (birthdayEl) birthdayEl.hidden = false;
          }
        }

        paintTime();
        var clockTimer = setInterval(paintTime, 1000);

        function drop() {
          clearInterval(clockTimer);
          clearInterval(progressTimer);
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }

        if (reduced) {
          window.__dismissAkbarPreloader = drop;
          drop();
          return;
        }

        // Kunjungan kedua dalam satu sesi TIDAK lagi melewatkan splash diam-
        // diam — dulu inilah sebabnya layar pembuka terasa "tidak ada" di
        // desktop (sekali reload, hilang selamanya sampai tab ditutup).
        // Sekarang ia tampil ringkas: hanya aksara + nama, ±0,46 dtk.
        if (seen) preloader.classList.add("an-splash-quick");

        var dismissed = false;
        var shownAt = Date.now();
        // Durasi splash: minimal 1.4 detik supaya seluruh sekuens terbaca,
        // dan tidak pernah lebih dari 2.2 detik.
        // Sekuens penuh selesai di ±1,25 dtk (aksara 0-0,62; nama 0,3-1,12;
        // garis 0,62-1,40). MIN_VISIBLE tidak boleh lebih pendek dari itu,
        // kalau tidak animasinya terpotong di tengah pada koneksi cepat.
        var MIN_VISIBLE = seen ? 460 : 1450;
        var MAX_VISIBLE = seen ? 900 : 2200;

        // Angka durasi = waktu yang benar-benar berjalan sejak splash tampil.
        function paintProgress() {
          var elapsed = Date.now() - shownAt;
          if (elapsedEl) elapsedEl.textContent = (elapsed / 1000).toFixed(1);
          if (meterFill) {
            meterFill.style.transform =
              "scaleX(" + Math.min(1, elapsed / MAX_VISIBLE) + ")";
          }
        }
        paintProgress();
        var progressTimer = setInterval(paintProgress, 100);

        function remove() {
          if (!preloader) return;
          preloader.classList.add("an-fade-out");
          setTimeout(drop, 560);
        }

        window.__dismissAkbarPreloader = function () {
          if (dismissed) return;
          dismissed = true;
          var wait = Math.max(0, MIN_VISIBLE - (Date.now() - shownAt));
          setTimeout(remove, wait);
        };

        // Jaring pengaman: splash tidak pernah menahan konten lebih lama dari ini.
        setTimeout(function () {
          if (typeof window.__dismissAkbarPreloader === "function") {
            window.__dismissAkbarPreloader();
          }
        }, MAX_VISIBLE);
      })();
    </script>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
